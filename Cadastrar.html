<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<meta name="description" content="Crie sua conta de visitante">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="nav"><div class="nav-in">
<a class="logo" href="index.html">Schwartz<span> Dev's</span></a>
<div class="links" id="links"><a href="index.html">Início</a><a href="Sobre.html">Sobre mim</a><a href="Portfólio.html">Projetos</a><a href="Contato.html">Contato</a><a class="entrar" href="Login.html" aria-current="page">Entrar</a></div>
<button class="icon-btn" id="tema" aria-label="Alternar tema claro/escuro"></button>
<button class="icon-btn burger" id="burger" aria-label="Abrir menu" aria-expanded="false">☰</button>
</div></nav>
<main class="center-page">
<div class="form-card">
<h1>Crie sua conta</h1>
<p class="sub">Leva menos de um minuto.</p>
<form data-msg="Cadastro apenas ilustrativo: nenhum dado foi salvo 🙂">
<div class="field"><label for="no">Nome</label><input id="no" type="text" placeholder="Seu nome completo" minlength="5" maxlength="50" required></div>
<div class="field"><label for="us">Usuário</label><input id="us" type="text" placeholder="Escolha um usuário" minlength="5" maxlength="50" required></div>
<div class="field"><label for="te">Telefone</label><input id="te" type="tel" placeholder="(41) 99999-9999" maxlength="20"></div>
<div class="field"><label for="se">Senha</label><input id="se" type="password" placeholder="Mínimo de 5 caracteres" minlength="5" maxlength="50" required><button type="button" class="eye" aria-label="Mostrar senha">👁️</button></div>
<div class="field"><label for="co">Confirmar senha</label><input id="co" type="password" placeholder="Repita a senha" minlength="5" maxlength="50" required><button type="button" class="eye" aria-label="Mostrar senha">👁️</button></div>
<button class="btn" type="submit">Cadastrar</button>
</form>
<p class="alt">Já tem conta? <a href="Login.html">Entrar</a></p>
</div>
</main>
<footer>© 2026 André Luis Pires da Silva · Feito com HTML, CSS e JavaScript</footer>
<div class="toast" id="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>

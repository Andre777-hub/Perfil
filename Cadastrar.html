<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>

        .cabeçalho{
            font-size: 50px;
            text-align: center;
            margin-top: 3%;
        }

        .Usuario,
        .Senha,
        .Nome,
        .Confirma,
        .Telefone{
            margin-top: 3%;
            text-align: center;
            font-size: 20px;
        }

        .Logar{
            font-size: 2rem;
            text-align: center;
            margin-top: 3%;
        }
        
        .Posição_botao{
            text-align: center;
            font-size: 25px;
        }
        a:hover{
            color: black;
        }
    </style>
</head>
<body>

    <header>
    <div class="cabeçalho"><b>Casdastro de Usuario</b></div>
    </header>

    <div class="Nome">
    <b>Nome:</b>
    <input type="text" placeholder="Nome" minlength="5" maxlength="50">
    </div>

    <div class="Usuario">
    <b>Usuario:</b>
    <input type="text" placeholder="Usuario" minlength="5" maxlength="50">
    </div>

    <div class="Senha">
    <b>Senha:</b>
    <input type="text" placeholder="Senha" minlength="5" maxlength="50">
    </div>

    <div class="Confirma">
    <b>Confirma:</b>
    <input type="text" placeholder="Confirma-se" minlength="5" maxlength="50">
    </div>
    
    <div class="Telefone">
    <b>Telefone:</b>
    <input type="text" placeholder="Telefone" minlength="5" maxlength="50">
    </div>

    <div class="Posição_botao">
    <button class="Logar">Logar</button>
    </div>
</body>
</html>
